version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: db-container
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: express-app
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://db-container:27017/ecommerce
      - PORT=5000
      - NODE_ENV=development
    volumes:
      - ./.env.example:/app/.env.example
      - ./.env:/app/.env
    depends_on:
      - mongodb
    networks:
      - ecommerce-network

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: react-app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    volumes:
      - ./client/.env.example:/app/.env.example
      - ./client/.env:/app/.env
    depends_on:
      - api
    networks:
      - ecommerce-network

volumes:
  mongodb_data:

networks:
  ecommerce-network:
    driver: bridge